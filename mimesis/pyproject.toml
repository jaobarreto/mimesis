[project]
name = "mimesis-research"
version = "0.0.0"
description = "Verificação local do pacote experimental de conhecimento MIMESIS"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
lab = ["streamlit>=1.45,<2", "numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99
