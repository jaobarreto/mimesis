[project]
name = "mimesis-knowledge-research"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "rapidfuzz>=3,<4", "polars>=1,<2", "duckdb>=1,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4"]
